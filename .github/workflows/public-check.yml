name: 公开复现核验
on: [push, pull_request, workflow_dispatch]
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: 公开单元测试
        run: python -B -m unittest discover -s midterm-model/tests -p "test_*.py"
      - name: 实证表逐字节复算
        run: python -B midterm-model/public/reproduce.py --check
      - name: 独立协议核验
        run: python -B research/validity-release-2026-09-08/verify_protocol.py
      - name: 同人面板独立合成测试
        run: python -B -m unittest discover -s research/ces-panel-2020-2024 -p test_panel.py
      - name: 同人面板匿名统计复算
        run: python -B research/ces-panel-2020-2024/reproduce.py --check
      - name: 入选构成独立测试
        run: python -B -m unittest discover -s research/ces-panel-retention-2026-09-08 -p test_retention.py
      - name: 入选构成匿名计数复算
        run: python -B research/ces-panel-retention-2026-09-08/reproduce.py --check
      - name: 两波留存适配器独立测试
        run: python -B -m unittest discover -s research/ces-panel-retention-2026-09-08/two-wave -p test_two_wave.py
      - name: 两波留存匿名计数复算
        run: python -B research/ces-panel-retention-2026-09-08/two-wave/reproduce.py --check
      - name: 早期变化选择诊断测试与复算
        run: |
          python -X utf8 -B -m unittest discover -s research/ces-earlier-change-selection-2026-09-08 -p test_selection.py
          python -X utf8 -B research/ces-earlier-change-selection-2026-09-08/analyze.py --check
          python -X utf8 -B research/ces-earlier-change-selection-2026-09-08/write_report.py --check
      - name: PID识别与遮蔽校准测试及匿名复算
        run: |
          python -X utf8 -B -m unittest discover -s research/ces-identification-calibration-2026-09-08 -p 'test_*.py'
          python -X utf8 -B research/ces-identification-calibration-2026-09-08/identify.py --check
          python -X utf8 -B research/ces-identification-calibration-2026-09-08/anonymous_benchmark.py
          python -X utf8 -B research/ces-identification-calibration-2026-09-08/report.py --check
          python -X utf8 -B research/ces-identification-calibration-2026-09-08/simulate.py --check
      - name: 四状态与结构机制独立测试及匿名复算
        run: |
          python -X utf8 -B -m unittest discover -s research/ces-four-state-mechanisms-2026-09-08 -p test_four_state.py
          python -X utf8 -B research/ces-four-state-mechanisms-2026-09-08/analyze.py --check
          python -X utf8 -B research/ces-four-state-mechanisms-2026-09-08/structure.py --check
          python -X utf8 -B research/ces-four-state-mechanisms-2026-09-08/report.py --check
          python -X utf8 -B research/ces-four-state-mechanisms-2026-09-08/dr_simulation.py --check
